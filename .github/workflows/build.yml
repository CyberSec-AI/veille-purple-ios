name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer \
          || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer \
          || sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          xcodebuild -version

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Remove xcodeVersion from project spec
        run: sed -i '' '/xcodeVersion/d' project.yml

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project VeillePurple.xcodeproj \
            -scheme VeillePurple \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/build" -name "*.app" -not -path "*/iphoneos.sdk/*" | head -1)
          echo "Found .app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qry VeillePurple-unsigned.ipa Payload/
          ls -lh VeillePurple-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeillePurple-unsigned-ipa
          path: VeillePurple-unsigned.ipa
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: VeillePurple-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}